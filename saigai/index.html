	};

		"https://yamauchi-inochu.github.io/classroom/saigai/geojson/10km-mesh.geojson",
		function (data) {

			L.geoJson(data, {
				style: PolygonStyle
			}).addTo(area);

		}
	);

		center: [37.1724, 136.9226],
		zoom: 10,
		layers: [
			map1
		],
		zoomControl: false
	});

		"淡色地図": map1

	};

		"対象範囲": area,
		"穴水地区（2024年1月5日）": anamizu_0105,

	map.on("overlayadd", function (e) {
	console.log("レイヤ表示: " + e.name);
});

map.on("overlayremove", function (e) {
	console.log("レイヤ非表示: " + e.name);
});


	L.control.scale({
		imperial: false
	}).addTo(map);


	var zoomHome = L.Control.zoomHome();

	zoomHome.addTo(map);


	map.addControl(
		new L.Control.Fullscreen()
	);


	var printer = L.easyPrint({
		tileLayer: map,
		sizeModes: [
			"Current",
			"A4Landscape",
			"A4Portrait"
		],
		filename: "Map",
		exportOnly: true,
		hideControlContainer: true
	}).addTo(map);


	function manualPrint() {

		printer.printMap(
			"CurrentSize",
			"MyManualPrint"
		);

	}


	var hash = new L.Hash(map);


	// 図形をまとめるためのオブジェクト

	var drawnItems = new L.FeatureGroup().addTo(map);


	var drawControl = new L.Control.Draw({

		draw: {
			polyline: false,
			polygon: false,
			rectangle: false,
			circle: false,
			marker: true
		},

		edit: {
			featureGroup: drawnItems
		},

		position: "topleft"

	}).addTo(map);


	map.on("draw:created", function (e) {

		drawnItems.addLayer(e.layer);

	});
